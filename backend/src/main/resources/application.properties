spring.application.name=HotelBooking

server.port=${SERVER_PORT}
management.port=${MANAGEMENT_PORT}
#server.port=5000

#logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
#logging.level.root=DEBUG

## docker run --name hotel -d -p 5432:5432 -e POSTGRES_PASSWORD=password -e POSTGRES_USER=root -v pgdata:/var/lib/postgresql/data postgres:17.5
## postgres connection
#spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/hotel}
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

secretJwtString=${SECRET_JWT_STRING}

## Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB


## AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.bucket-arn=${AWS_S3_BUCKET_ARN}
aws.s3.region=${AWS_S3_REGION}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.bucket-url=${AWS_S3_BUCKET_URL}
aws.s3.bucket-images-folder=${AWS_S3_BUCKET_IMAGES_FOLDER}

